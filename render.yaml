# =============================================================
# Render Blueprint Specification (TASK-FS3)
# Deploys both FastAPI Backend & React Frontend on Render (100% Free)
# =============================================================

services:
  # -----------------------------------------------------------
  # 1. FastAPI Multi-Agent RAG Backend Web Service
  # -----------------------------------------------------------
  - type: web
    name: ai-software-engineer-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn src.api.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
      - key: SUPABASE_DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434

  # -----------------------------------------------------------
  # 2. React + Vite Frontend Static Site (Global CDN)
  # -----------------------------------------------------------
  - type: web
    name: ai-software-engineer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-software-engineer-backend
          property: host
